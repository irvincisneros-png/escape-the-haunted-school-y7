<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A Halloween escape game for Year 7 Science.">
<title>Escape the Haunted School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Single dark look on purpose: it's a haunted building at night. */
:root {
  --ink: #0d0a14; --panel: #1a1426; --line: #3a2d52; --bone: #f3ead8; --mist: #a99fbf;
  --pumpkin: #ff7a1a; --slime: #7dff6a; --blood: #e0384a; --moon: #ffe9a8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--bone);
  font-family: Nunito, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: Creepster, cursive;
  font-size: 2rem; color: var(--pumpkin); letter-spacing: .05em; }
</style>
<link rel="stylesheet" href="css/ui.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui"></div>
<div id="boot">Loading the haunted school…</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
